name: lantern-binaries

# Builds lanternd as liblantern_novpn.so: the SOCKS-only core the MSN Guard app needs
# (no TUN, no netlink), for every Android ABI the app may run on:
#   arm64-v8a (required), armeabi-v7a, x86_64 (+ optional x86).
#
# arm64-v8a is the mandatory ABI: if it fails, the job fails.
# The other ABIs never block the job (continue-on-error), but every binary that
# WAS produced is verified from the finished file: the SOCKS tag must be in the Go
# build info and the TUN option builder must not be linked in. If any produced
# binary fails that proof, nothing is published as "liblantern".

on:
  workflow_dispatch:
    inputs:
      radiance_ref:
        description: "radiance branch/tag/commit"
        default: "main"
      package:
        description: "Go package"
        default: "./cmd/lanternd"
      build_tags:
        description: "Go build tags (comma separated), WITHOUT the SOCKS tag"
        default: "with_gvisor,with_quic,with_wireguard,with_utls,with_grpc,with_clash_api,standalone"
      socks_tag:
        description: "Tag that selects the SOCKS backend: 'novpn' on radiance main; 'stealth_novpn' only on the PR #486 branch"
        default: "novpn"
      build_armv7:
        description: "Also build armeabi-v7a (32-bit ARM). May fail, never blocks the job"
        type: boolean
        default: true
      build_x86_64:
        description: "Also build x86_64 (emulators, Chromebooks, some tablets). May fail, never blocks the job"
        type: boolean
        default: true
      build_x86:
        description: "Also build x86 (32-bit, old emulators). May fail, never blocks the job"
        type: boolean
        default: false
      build_default:
        description: "Also build the TUN liblantern.so (the app cannot use it; leave off)"
        type: boolean
        default: false

env:
  GH_PAT: ${{ secrets.GH_PAT }}   # optional, only for private modules
  TAGS: ${{ inputs.build_tags }}
  SOCKS_TAG: ${{ inputs.socks_tag }}
  PKG: ${{ inputs.package }}

jobs:
  binary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: getlantern/radiance
          ref: ${{ inputs.radiance_ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Private modules (only if GH_PAT secret exists)
        if: ${{ env.GH_PAT != '' }}
        run: |
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=github.com/getlantern/*" >> $GITHUB_ENV

      - name: Download modules
        run: |
          set -o pipefail
          go mod download 2>&1 | tee deps.log

      # Read-only facts about this exact radiance checkout: which files the SOCKS tag
      # gates, and what the SOCKS backend does. Uploaded as source-facts.txt.
      - name: Source facts
        if: always()
        run: |
          {
            echo "## radiance commit"; git log -1 --format='%H %cd %s' 2>&1
            echo; echo "## go"; go version
            echo; echo "## files gated by a *novpn* build tag"
            grep -rn -E '^//go:build.*novpn' --include=*.go . | head -60
            echo; echo "## vpn/ files that mention novpn"; ls vpn | grep -i novpn
            echo; echo "## vpn/boxoptions_novpn.go"; cat vpn/boxoptions_novpn.go 2>&1
            echo; echo "## vpn/boxoptions_default.go (first 25 lines)"; sed -n '1,25p' vpn/boxoptions_default.go 2>&1
            echo; echo "## who reads RADIANCE_SOCKS_ADDRESS / device id"
            grep -rn "RADIANCE_SOCKS_ADDRESS\|RADIANCE_USE_SOCKS_PROXY\|RADIANCE_DEVICE_ID" --include=*.go . | head -20
            grep -rn "DeviceIDKey" --include=*.go common/settings | head -10
          } > source-facts.txt 2>&1 || true
          echo "::group::source-facts.txt"
          cat source-facts.txt
          echo "::endgroup::"

      - name: Locate NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ]; then NDK="$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -1)"; fi
          echo "NDK=$NDK" >> $GITHUB_ENV
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"

      # Run #11 proved the SOCKS branch is in the binary, yet connect still died on Android with
      # "create network monitor: netlink socket in Android is banned by Google". sing-box treats
      # a failing network monitor as fatal only when route.auto_detect_interface is on. A SOCKS-only
      # core has nothing to detect (the app excludes its own UID from the TUN), so the monitor
      # failure must be non-fatal. Two independent patches; each one prints what it did.
      - name: Patch - no fatal netlink network monitor
        run: |
          set +e
          {
            echo "## radiance: AutoDetectInterface before"
            grep -rn -i "AutoDetectInterface\|auto_detect_interface" --include=*.go . | grep -v _test.go | tee patch-before.txt
            echo "## 1) radiance: never request auto-detect"
            grep -rl -i "AutoDetectInterface\|auto_detect_interface" --include=*.go vpn backend config 2>/dev/null | grep -v _test.go | while read -r f; do
              perl -pi -e 's/(AutoDetectInterface\s*[:=]+\s*)true/${1}false/g; s/("auto_detect_interface"\s*:\s*)true/${1}false/g' "$f"
              echo "patched $f"
            done
            echo "## radiance: after"
            grep -rn -i "AutoDetectInterface\|auto_detect_interface" --include=*.go . | grep -v _test.go
            echo "## 2) sing-box: make a failing network monitor non-fatal"
            D="$(go list -m -f '{{if .Replace}}{{.Replace.Dir}}{{else}}{{.Dir}}{{end}}' github.com/sagernet/sing-box)"
            F="$D/route/network.go"
            echo "sing-box dir: $D"
            if [ -f "$F" ]; then
              chmod -R u+w "$D" 2>/dev/null
              echo "-- code around the error, before:"
              grep -n -B6 -A8 'create network monitor' "$F" | head -60
              if grep -q 'enforceInterfaceMonitor := options.AutoDetectInterface' "$F"; then
                sed -i 's/enforceInterfaceMonitor := options.AutoDetectInterface/enforceInterfaceMonitor := false/' "$F"
                echo "PATCHED sing-box: enforceInterfaceMonitor := false"
              else
                echo "::warning::route/network.go has no 'enforceInterfaceMonitor := options.AutoDetectInterface' line. Send patch-log.txt"
              fi
            else
              echo "::warning::$F not found"
            fi
          } 2>&1 | tee patch-log.txt

      # One shared build script for every ABI, so all of them are built the same way:
      #   ./ci-build-core.sh <abi>      abi = arm64-v8a | armeabi-v7a | x86_64 | x86
      # Two attempts: the full tag set first, then a slimmer one (without with_wireguard and
      # standalone) in case the SOCKS branch does not compile with them. The tag set that
      # worked for the first ABI (arm64-v8a) is recorded in USED_TAGS and tried first for the
      # next ABIs. No -v: it prints every package name and buries the one error line.
      - name: Prepare build helper
        run: |
          cat > ci-build-core.sh <<'EOF'
          #!/usr/bin/env bash
          set -uo pipefail
          ABI="$1"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          PAGE=""
          case "$ABI" in
            arm64-v8a)   GOARCH_=arm64; GOARM_="";  CLANG="aarch64-linux-android24-clang";     PAGE="-Wl,-z,max-page-size=16384" ;;
            armeabi-v7a) GOARCH_=arm;   GOARM_="7"; CLANG="armv7a-linux-androideabi24-clang"   ;;
            x86_64)      GOARCH_=amd64; GOARM_="";  CLANG="x86_64-linux-android24-clang";      PAGE="-Wl,-z,max-page-size=16384" ;;
            x86)         GOARCH_=386;   GOARM_="";  CLANG="i686-linux-android24-clang"         ;;
            *) echo "::error::unknown ABI $ABI"; exit 2 ;;
          esac
          CC_BIN="$TC/$CLANG"
          CXX_BIN="$TC/${CLANG}++"
          if [ ! -x "$CXX_BIN" ]; then echo "::error::NDK has no $CLANG++"; exit 1; fi
          OUT="out/$ABI/liblantern_novpn.so"
          mkdir -p "out/$ABI"

          build_core() {  # $1 tags, $2 log file
            CGO_ENABLED=1 GOOS=android GOARCH="$GOARCH_" GOARM="$GOARM_" CC="$CC_BIN" CXX="$CXX_BIN" \
            go build -trimpath -buildmode=pie -tags "$1" \
              -ldflags "-s -w -checklinkname=0 -linkmode=external -extld=$CXX_BIN -extldflags '-static-libstdc++ $PAGE'" \
              -o "$OUT" "$PKG" > "$2" 2>&1
          }

          FULL="$TAGS,$SOCKS_TAG"
          SLIM="$(echo "$TAGS" | tr ',' '\n' | grep -v -x -e with_wireguard -e standalone | paste -sd, - || true),$SOCKS_TAG"
          FIRST="${USED_TAGS:-$FULL}"

          ok=0
          for attempt in "first|$FIRST" "slim|$SLIM"; do
            name="${attempt%%|*}"; tags="${attempt#*|}"
            # do not retry the same tag set twice
            if [ "$name" = slim ] && [ "$tags" = "$FIRST" ]; then continue; fi
            echo "::group::$ABI attempt $name  tags=$tags"
            if build_core "$tags" "build-$ABI-$name.log"; then
              echo "built OK"
              echo "$tags" > "out/$ABI/.used_tags"
              if [ -z "${USED_TAGS:-}" ]; then echo "USED_TAGS=$tags" >> "$GITHUB_ENV"; fi
              echo "::endgroup::"
              ok=1
              break
            fi
            echo "FAILED, last 50 lines:"
            tail -50 "build-$ABI-$name.log"
            echo "::endgroup::"
          done
          if [ "$ok" != 1 ]; then
            rm -f "$OUT"
            echo "::error::$ABI SOCKS core did not compile. See build-$ABI-*.log (artifact lantern-report-and-logs)."
            exit 1
          fi
          file "$OUT"
          ls -lh "$OUT"
          EOF
          chmod +x ci-build-core.sh

      - name: Build arm64-v8a SOCKS core -> liblantern_novpn.so (required)
        run: ./ci-build-core.sh arm64-v8a

      - name: Build x86_64 SOCKS core (allowed to fail)
        if: ${{ inputs.build_x86_64 }}
        continue-on-error: true
        run: ./ci-build-core.sh x86_64

      - name: Build armeabi-v7a SOCKS core (allowed to fail)
        if: ${{ inputs.build_armv7 }}
        continue-on-error: true
        run: ./ci-build-core.sh armeabi-v7a

      - name: Build x86 SOCKS core (allowed to fail)
        if: ${{ inputs.build_x86 }}
        continue-on-error: true
        run: ./ci-build-core.sh x86

      # Proof from each finished binary, not from the command line:
      #  - the Go build info must list the SOCKS tag
      #  - the TUN option builder (boxoptions_default.go) must not be linked in
      # core-info.txt carries the sha256: the app prints the first 16 hex digits in its log.
      # Every binary that exists is checked; one bad binary fails the whole step, so a
      # wrong core can never be published next to the good ones.
      - name: Verify every core is the SOCKS build
        id: verify
        continue-on-error: true
        run: |
          : > core-info.txt
          {
            echo "### Core check"
            echo "| ABI | SOCKS tag \`$SOCKS_TAG\` in build info | TUN builder linked (must be 0) | SOCKS builder linked | sha256 (first 16) |"
            echo "|---|---|---|---|---|"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          bad=0
          found=0
          for f in out/*/liblantern_novpn.so; do
            [ -f "$f" ] || continue
            found=$((found+1))
            abi="$(basename "$(dirname "$f")")"
            {
              echo "=================== $abi"
              echo "file: $f"; sha256sum "$f"; ls -l "$f"; file "$f"
              echo "used tags: $(cat "out/$abi/.used_tags" 2>/dev/null)"
              go version -m "$f"
            } >> core-info.txt 2>&1
            has_tag=0
            if go version -m "$f" | grep -E 'build[[:space:]]+-tags=' | sed 's/.*-tags=//' | tr ',' '\n' | grep -qx "$SOCKS_TAG"; then has_tag=1; fi
            tun_refs="$(strings -a "$f" | grep -c 'boxoptions_default.go' || true)"
            socks_refs="$(strings -a "$f" | grep -c 'boxoptions_novpn.go' || true)"
            echo "| $abi | $([ $has_tag = 1 ] && echo yes || echo NO) | $tun_refs | $socks_refs | $(sha256sum "$f" | cut -c1-16) |" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$has_tag" != 1 ] || [ "$tun_refs" != 0 ]; then
              echo "::error::$abi liblantern_novpn.so is NOT a SOCKS-only build (tag present: $has_tag, TUN code references: $tun_refs)"
              bad=1
            fi
          done
          grep -E 'path|build[[:space:]]+(-tags|GOARCH|CGO_ENABLED|vcs\.revision)|go1\.|^=====' core-info.txt || true
          if [ "$found" = 0 ]; then echo "::error::no core was built"; exit 1; fi
          if [ ! -f out/arm64-v8a/liblantern_novpn.so ]; then echo "::error::the required arm64-v8a core is missing"; exit 1; fi
          if [ "$bad" != 0 ]; then exit 1; fi
          echo "all $found core(s) OK: SOCKS-only build"

      # Opt-in only. The TUN build cannot run in the app (needs netlink), and shipping it
      # next to the SOCKS one invites a silent fallback to the wrong core.
      # Built AFTER verification so it can never influence the SOCKS check.
      - name: Build arm64-v8a TUN core -> liblantern.so (opt-in)
        if: ${{ inputs.build_default }}
        continue-on-error: true
        run: |
          set -o pipefail
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC_BIN="$TC/aarch64-linux-android24-clang"
          CXX_BIN="$TC/aarch64-linux-android24-clang++"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$CC_BIN" CXX="$CXX_BIN" \
          go build -trimpath -buildmode=pie -tags "$TAGS" \
            -ldflags "-s -w -checklinkname=0 -linkmode=external -extld=$CXX_BIN -extldflags '-static-libstdc++ -Wl,-z,max-page-size=16384'" \
            -o out/arm64-v8a/liblantern.so "$PKG" 2>&1 | tee build-arm64-default.log

      - name: What was produced
        if: always()
        run: |
          rm -f out/*/.used_tags
          ls -lh out/*/ 2>/dev/null || echo "nothing in out/"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lantern-report-and-logs
          path: |
            source-facts.txt
            patch-log.txt
            patch-before.txt
            core-info.txt
            deps.log
            build-*.log
          if-no-files-found: ignore

      # Only verified SOCKS cores are published as the "liblantern" artifact.
      # Layout: out/<abi>/liblantern_novpn.so  ->  jniLibs/<abi>/ in the app.
      - uses: actions/upload-artifact@v4
        if: ${{ steps.verify.outcome == 'success' }}
        with:
          name: liblantern
          path: out/

      - name: Fail the job if a core is not the SOCKS build
        if: ${{ always() && steps.verify.outcome == 'failure' }}
        run: |
          echo "::error::Core verification failed: nothing was published as 'liblantern'. See core-info.txt and source-facts.txt in lantern-report-and-logs."
          exit 1
