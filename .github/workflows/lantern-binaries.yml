name: lantern-binaries

on:
  workflow_dispatch:
    inputs:
      radiance_ref:
        description: "radiance branch/tag/commit"
        default: "main"
      package:
        description: "Go package"
        default: "./cmd/lanternd"
      build_tags:
        description: "Go build tags (comma separated)"
        default: "with_gvisor,with_quic,with_wireguard,with_utls,with_grpc,with_clash_api,standalone"

env:
  GH_PAT: ${{ secrets.GH_PAT }}   # optional, only for private modules

jobs:
  binary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: getlantern/radiance
          ref: ${{ inputs.radiance_ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Private modules (only if GH_PAT secret exists)
        if: ${{ env.GH_PAT != '' }}
        run: |
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=github.com/getlantern/*" >> $GITHUB_ENV

      - name: Download modules
        run: |
          set -o pipefail
          go mod download 2>&1 | tee deps.log

      # Read-only deep dump. report.txt answered the routes question; this one
      # answers the two that are left: where lanternd gets its device id and why
      # the IPC socket resets every client. Download the artifact and send report2.txt.
      - name: Dump daemon source (deep)
        if: always()
        run: |
          {
            echo "## lanternd.go from line 395 (runDaemon)"
            sed -n '395,760p' cmd/lanternd/lanternd.go
            echo; echo "## backend/radiance.go 95-270 (Options, device id)"
            sed -n '95,270p' backend/radiance.go
            echo; echo "## ipc: connection / auth (whole files)"
            for f in ipc/conn_nonwindows.go ipc/socket_mobile.go ipc/socket.go; do echo "### $f"; cat "$f" 2>/dev/null; done
            echo; echo "## ipc: anything about peers, credentials, uid, auth"
            grep -rn -i -E 'peer|cred|getuid|\buid\b|auth|forbid|reject' --include=*.go ipc | grep -v _test | head -80
            echo; echo "## ipc: files"; ls ipc
            echo; echo "## ipc/server.go 128-220 (Server, middleware)"
            sed -n '128,220p' ipc/server.go
            echo; echo "## vpnConnectHandler"
            grep -n "func (s \*Server) vpnConnectHandler" -A40 ipc/server.go
            echo; echo "## novpn"
            for f in vpn/boxoptions_novpn.go; do echo "### $f"; cat "$f" 2>/dev/null; done
            ls vpn | grep -i novpn
            echo; echo "## settings: DeviceIDKey / defaults"
            grep -rn "DeviceIDKey\|DataPathKey" --include=*.go common/settings | head -20
            echo; echo "## LocalBackend methods"
            go doc ./backend LocalBackend 2>&1 | head -120
            echo; echo "## Options"
            go doc ./backend Options 2>&1 | head -60
          } > report2.txt 2>&1 || true
          echo "report2.txt: $(wc -c < report2.txt) bytes"
          echo "::group::report2.txt (open to copy)"
          cat report2.txt
          echo "::endgroup::"

      - name: Locate NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ]; then NDK="$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -1)"; fi
          echo "NDK=$NDK" >> $GITHUB_ENV
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"

      # No -v anywhere below: it prints every package name and buries the one
      # error line that matters.
      - name: Build arm64-v8a (default) -> liblantern.so
        run: |
          set -o pipefail
          mkdir -p out/arm64-v8a
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC_BIN="$TC/aarch64-linux-android24-clang"
          CXX_BIN="$TC/aarch64-linux-android24-clang++"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$CC_BIN" CXX="$CXX_BIN" \
          go build -trimpath -buildmode=pie -tags "${{ inputs.build_tags }}" \
            -ldflags "-s -w -checklinkname=0 -linkmode=external -extld=$CXX_BIN -extldflags '-static-libstdc++ -Wl,-z,max-page-size=16384'" \
            -o out/arm64-v8a/liblantern.so "${{ inputs.package }}" 2>&1 | tee build-arm64.log
          file out/arm64-v8a/liblantern.so
          ls -lh out/arm64-v8a/liblantern.so

      # SOCKS-only backend (no libbox TUN). May fail to compile; the next step
      # prints exactly why, so a green job can no longer hide a missing file.
      - name: Build arm64-v8a (stealth_novpn) -> liblantern_novpn.so
        id: novpn
        continue-on-error: true
        run: |
          set -o pipefail
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC_BIN="$TC/aarch64-linux-android24-clang"
          CXX_BIN="$TC/aarch64-linux-android24-clang++"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$CC_BIN" CXX="$CXX_BIN" \
          go build -trimpath -buildmode=pie -tags "${{ inputs.build_tags }},stealth_novpn" \
            -ldflags "-s -w -checklinkname=0 -linkmode=external -extld=$CXX_BIN -extldflags '-static-libstdc++ -Wl,-z,max-page-size=16384'" \
            -o out/arm64-v8a/liblantern_novpn.so "${{ inputs.package }}" 2>&1 | tee build-novpn.log
          file out/arm64-v8a/liblantern_novpn.so
          ls -lh out/arm64-v8a/liblantern_novpn.so

      - name: Result of the stealth_novpn build
        if: always()
        run: |
          if [ "${{ steps.novpn.outcome }}" = "success" ]; then
            echo "stealth_novpn: BUILT"
          else
            echo "stealth_novpn: FAILED. Last 60 lines of its log:"
            echo "::group::build-novpn.log (tail)"
            tail -60 build-novpn.log 2>/dev/null || echo "(no log)"
            echo "::endgroup::"
          fi

      - name: Build armeabi-v7a (allowed to fail)
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p out/armeabi-v7a
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC_BIN="$TC/armv7a-linux-androideabi24-clang"
          CXX_BIN="$TC/armv7a-linux-androideabi24-clang++"
          CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 CC="$CC_BIN" CXX="$CXX_BIN" \
          go build -trimpath -buildmode=pie -tags "${{ inputs.build_tags }}" \
            -ldflags "-s -w -checklinkname=0 -linkmode=external -extld=$CXX_BIN -extldflags '-static-libstdc++'" \
            -o out/armeabi-v7a/liblantern.so "${{ inputs.package }}" 2>&1 | tee build-armv7.log
          file out/armeabi-v7a/liblantern.so
          ls -lh out/armeabi-v7a/liblantern.so

      - name: What was produced
        if: always()
        run: |
          ls -lh out/*/ 2>/dev/null || echo "nothing in out/"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lantern-report-and-logs
          path: |
            report2.txt
            deps.log
            build-*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: liblantern
          path: out/
